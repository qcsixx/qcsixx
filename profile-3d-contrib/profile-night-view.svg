<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyline-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="skyline-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="20" fill="url(#skyline-bg)" stroke="url(#skyline-border)" stroke-width="1.2" />

  <g transform="translate(440, 105)" text-anchor="middle">
    <!-- Isometric City Skyline Icon Silhouette -->
    <g transform="translate(0, -35)">
      <polygon points="-50,20 0,-10 50,20 0,50" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <polygon points="-30,10 0,-8 30,10 0,28" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
      <polygon points="-15,2 0,-7 15,2 0,11" fill="url(#bar-glow)" />
    </g>

    <text y="42" fill="#f8fafc" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" letter-spacing="1">
      3D ISOMETRIC CONTRIBUTION SKYLINE
    </text>
    <text y="64" fill="#64748b" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
      Synchronizing commit history with GitHub Actions • Updates every 12 hours
    </text>
  </g>
</svg>
