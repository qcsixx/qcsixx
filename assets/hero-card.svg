<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <!-- Matte Canvas Gradient -->
    <linearGradient id="monolith-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="50%" stop-color="#07090f" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Swiss 1px Titanium Border -->
    <linearGradient id="monolith-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Pure Titanium Monogram Gradient (No Neon) -->
    <linearGradient id="pure-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      }
    ]]></style>
  </defs>

  <!-- Canvas Frame -->
  <rect x="2" y="2" width="916" height="246" rx="16" fill="url(#monolith-bg)" stroke="url(#monolith-border)" stroke-width="1.2" />

  <!-- ================= LEFT: PURE TITANIUM MONOGRAM ================= -->
  <g transform="translate(48, 42)">
    <!-- Frosted Matte Squircle -->
    <rect width="166" height="166" rx="34" fill="#0b0d14" stroke="url(#monolith-border)" stroke-width="1.2" />

    <!-- Pure Geometric Q Vector (Zero Neon Dots) -->
    <circle cx="83" cy="83" r="44" fill="none" stroke="url(#pure-titanium)" stroke-width="8" stroke-linecap="round" />
    <line x1="108" y1="108" x2="128" y2="128" stroke="url(#pure-titanium)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- ================= RIGHT: SWISS EDITORIAL TYPOGRAPHY ================= -->
  <g transform="translate(254, 40)">

    <!-- Modern Friendly Greeting (Gen Z / Dev Style, Not Corporate) -->
    <text x="0" y="22" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="0.2">
      hey, i'm <tspan fill="#f1f5f9" font-weight="700">rifqi primanda</tspan> <tspan fill="#64748b">(@qcsixx)</tspan>
    </text>

    <!-- Primary Punchy Value Headline -->
    <text x="0" y="62" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.6">
      Building apps &amp; modern web platforms.
    </text>

    <!-- Natural, Senior & Human Bio -->
    <text x="0" y="98" fill="#cbd5e1" font-size="13.5" font-weight="400" letter-spacing="0.1">
      <tspan x="0" dy="0">Mobile &amp; web developer turning ideas into smooth, high-performance software.</tspan>
      <tspan x="0" dy="21" fill="#64748b">Obsessed with clean architecture, fluid 60fps UI, and zero lag.</tspan>
    </text>

    <!-- Core Tech Stack Pills (Matte Minimalist) -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="76" height="24" rx="12" fill="#10141e" stroke="url(#monolith-border)" stroke-width="0.8" />
      <text x="38" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600" text-anchor="middle">Flutter</text>

      <rect x="84" y="0" width="98" height="24" rx="12" fill="#10141e" stroke="url(#monolith-border)" stroke-width="0.8" />
      <text x="133" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600" text-anchor="middle">TypeScript</text>

      <rect x="190" y="0" width="80" height="24" rx="12" fill="#10141e" stroke="url(#monolith-border)" stroke-width="0.8" />
      <text x="230" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600" text-anchor="middle">Next.js</text>

      <rect x="278" y="0" width="56" height="24" rx="12" fill="#10141e" stroke="url(#monolith-border)" stroke-width="0.8" />
      <text x="306" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600" text-anchor="middle">Go</text>

      <rect x="342" y="0" width="100" height="24" rx="12" fill="#10141e" stroke="url(#monolith-border)" stroke-width="0.8" />
      <text x="392" y="16" fill="#f1f5f9" font-size="11.5" font-weight="600" text-anchor="middle">PostgreSQL</text>
    </g>

  </g>
</svg>
