<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Matte Canvas Gradient -->
    <linearGradient id="monolith-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="50%" stop-color="#07090f" />
      <stop offset="100%" stop-color="#040507" />
    </linearGradient>

    <!-- Swiss 1px Titanium Border -->
    <linearGradient id="monolith-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Luxury Pure Titanium Monogram Gradient (Matching Gambar 3) -->
    <linearGradient id="luxury-q" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      }
    ]]></style>
  </defs>

  <!-- Canvas Frame -->
  <rect x="2" y="2" width="916" height="226" rx="16" fill="url(#monolith-bg)" stroke="url(#monolith-border)" stroke-width="1.2" />

  <!-- ================= LEFT: LUXURY SERIF "Q" MONOGRAM (GAMBAR 3) ================= -->
  <g transform="translate(48, 32)">
    <!-- Frosted Matte Squircle Backing -->
    <rect width="166" height="166" rx="34" fill="#080a10" stroke="url(#monolith-border)" stroke-width="1.2" />

    <!-- Authentic Luxury Editorial Serif "Q" Vector Path -->
    <g transform="translate(13, 13)">
      <!-- Main Outer & Counter Silhouette of Serif Q -->
      <path d="M 70 8 
               C 34 8, 8 36, 8 72 
               C 8 98, 22 120, 42 131 
               C 36 124, 34 116, 36 108 
               C 38 100, 44 94, 52 92 
               C 42 98, 36 106, 34 116 
               C 22 106, 16 88, 16 72 
               C 16 42, 38 16, 70 16 
               C 92 16, 110 28, 118 46 
               L 118 30 
               C 106 16, 89 8, 70 8 Z" 
            fill="url(#luxury-q)" />

      <!-- Right Bowl & Vertical Serif Stem -->
      <path d="M 118 46 
               C 126 60, 130 76, 130 92 
               C 130 114, 120 134, 102 146 
               C 114 136, 122 120, 122 102 
               C 122 84, 118 68, 110 54 
               L 110 92 
               L 118 92 
               L 118 46 Z" 
            fill="url(#luxury-q)" />

      <!-- Dramatic Calligraphic Tail (Gambar 3 Swash) -->
      <path d="M 52 92 
               C 62 88, 74 88, 86 94 
               C 98 100, 108 112, 116 126 
               C 124 140, 136 150, 150 152 
               L 152 148 
               C 140 146, 130 138, 122 124 
               C 114 110, 102 96, 88 90 
               C 74 84, 62 84, 52 92 Z" 
            fill="url(#luxury-q)" />

      <!-- Bottom Flared Terminal Sweep -->
      <path d="M 116 126 
               C 122 138, 132 148, 146 152 
               L 154 152 
               C 142 144, 134 132, 126 120 
               L 116 126 Z" 
            fill="url(#luxury-q)" opacity="0.9" />

      <!-- Left Inner Crescent Accent Spur -->
      <path d="M 42 131 
               C 48 138, 56 144, 66 148 
               C 76 152, 88 152, 98 148 
               L 102 146 
               C 88 148, 74 146, 62 140 
               C 52 135, 46 128, 42 120 
               L 42 131 Z" 
            fill="url(#luxury-q)" />
    </g>
  </g>

  <!-- ================= RIGHT: SWISS EDITORIAL TYPOGRAPHY (UNCLUTTERED) ================= -->
  <g transform="translate(254, 48)">

    <!-- Modern Friendly Greeting -->
    <text x="0" y="24" fill="#94a3b8" font-size="14.5" font-weight="600" letter-spacing="0.2">
      hey, i'm <tspan fill="#f8fafc" font-weight="700">rifqi primanda</tspan> <tspan fill="#64748b">(@qcsixx)</tspan>
    </text>

    <!-- Primary Punchy Value Headline -->
    <text x="0" y="70" fill="#ffffff" font-size="29" font-weight="800" letter-spacing="-0.7">
      Building apps &amp; modern web platforms.
    </text>

    <!-- Natural, Human & Senior Description (More Breathing Room) -->
    <text x="0" y="112" fill="#cbd5e1" font-size="14" font-weight="400" letter-spacing="0.1">
      <tspan x="0" dy="0">Mobile &amp; web developer turning ideas into smooth, high-performance software.</tspan>
      <tspan x="0" dy="24" fill="#64748b">Obsessed with clean architecture, fluid 60fps UI, and zero lag.</tspan>
    </text>

  </g>
</svg>
