<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 90" width="100%" height="100%">
  <defs>
    <!-- Titanium Border Highlight -->
    <linearGradient id="island-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glass Capsule Fill -->
    <linearGradient id="island-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#07090f" stop-opacity="0.95" />
    </linearGradient>

    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      }

      /* Apple Dynamic Waveform Animations */
      @keyframes wave1 {
        0%, 100% { height: 6px; y: 42px; }
        50% { height: 26px; y: 32px; }
      }
      @keyframes wave2 {
        0%, 100% { height: 22px; y: 34px; }
        50% { height: 8px; y: 41px; }
      }
      @keyframes wave3 {
        0%, 100% { height: 12px; y: 39px; }
        50% { height: 32px; y: 29px; }
      }
      @keyframes wave4 {
        0%, 100% { height: 28px; y: 31px; }
        50% { height: 14px; y: 38px; }
      }
      @keyframes wave5 {
        0%, 100% { height: 8px; y: 41px; }
        50% { height: 20px; y: 35px; }
      }

      .bar-1 { animation: wave1 1.2s ease-in-out infinite; }
      .bar-2 { animation: wave2 1.4s ease-in-out infinite 0.15s; }
      .bar-3 { animation: wave3 1.1s ease-in-out infinite 0.3s; }
      .bar-4 { animation: wave4 1.5s ease-in-out infinite 0.1s; }
      .bar-5 { animation: wave5 1.3s ease-in-out infinite 0.25s; }

      @keyframes pulseDot {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .green-dot {
        animation: pulseDot 2s ease-in-out infinite;
      }
    ]]></style>
  </defs>

  <!-- Capsule Outer Glow & Border -->
  <rect x="2" y="2" width="916" height="86" rx="43" fill="url(#island-fill)" stroke="url(#island-border)" stroke-width="1.2" />

  <!-- ================= LEFT: DYNAMIC AUDIO / SYSTEM WAVEFORM ================= -->
  <g transform="translate(32, 0)">
    <!-- 5 Animated Waveform Bars (Titanium / Ice Cyan) -->
    <rect class="bar-1" x="0" y="42" width="3.5" height="6" rx="1.75" fill="#38bdf8" />
    <rect class="bar-2" x="8" y="34" width="3.5" height="22" rx="1.75" fill="#e2e8f0" />
    <rect class="bar-3" x="16" y="39" width="3.5" height="12" rx="1.75" fill="#38bdf8" />
    <rect class="bar-4" x="24" y="31" width="3.5" height="28" rx="1.75" fill="#2dd4bf" />
    <rect class="bar-5" x="32" y="41" width="3.5" height="8" rx="1.75" fill="#94a3b8" />

    <!-- Waveform Label -->
    <text x="50" y="42" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">SYSTEM PULSE</text>
    <text x="50" y="58" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">REALTIME TELEMETRY</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="260" y1="24" x2="260" y2="66" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- ================= CENTER: CURRENT ARCHITECTURAL FOCUS ================= -->
  <g transform="translate(290, 24)">
    <rect width="360" height="42" rx="21" fill="#06080d" stroke="url(#island-border)" stroke-width="0.8" />
    <circle class="green-dot" cx="20" cy="21" r="3.5" fill="#2dd4bf" />
    <text x="32" y="25" fill="#94a3b8" font-size="11" font-weight="600">
      <tspan fill="#f1f5f9" font-weight="700">NOW ARCHITECTING :</tspan> Cross-Platform &amp; Web Systems
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="680" y1="24" x2="680" y2="66" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- ================= RIGHT: HARDWARE & OS METRICS ================= -->
  <g transform="translate(710, 36)">
    <text font-size="11" font-weight="600">
      <tspan fill="#64748b">OS // WM</tspan>
      <tspan fill="#38bdf8" dx="6">:</tspan>
      <tspan fill="#e2e8f0" dx="6">Arch Linux / Hyprland</tspan>
    </text>
    <text y="20" font-size="11" font-weight="600">
      <tspan fill="#64748b">LATENCY</tspan>
      <tspan fill="#2dd4bf" dx="6">:</tspan>
      <tspan fill="#2dd4bf" dx="6">0.1ms • High Performance</tspan>
    </text>
  </g>
</svg>
