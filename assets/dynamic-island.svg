<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 86" width="100%" height="100%">
  <defs>
    <!-- Titanium Border Highlight -->
    <linearGradient id="island-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glass Capsule Fill -->
    <linearGradient id="island-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#07090f" stop-opacity="0.95" />
    </linearGradient>

    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
      }
      @keyframes wave1 { 0%, 100% { height: 6px; y: 40px; } 50% { height: 26px; y: 30px; } }
      @keyframes wave2 { 0%, 100% { height: 22px; y: 32px; } 50% { height: 8px; y: 39px; } }
      @keyframes wave3 { 0%, 100% { height: 12px; y: 37px; } 50% { height: 30px; y: 28px; } }
      @keyframes wave4 { 0%, 100% { height: 26px; y: 30px; } 50% { height: 12px; y: 37px; } }
      @keyframes wave5 { 0%, 100% { height: 8px; y: 39px; } 50% { height: 18px; y: 34px; } }

      .bar-1 { animation: wave1 1.2s ease-in-out infinite; }
      .bar-2 { animation: wave2 1.4s ease-in-out infinite 0.15s; }
      .bar-3 { animation: wave3 1.1s ease-in-out infinite 0.3s; }
      .bar-4 { animation: wave4 1.5s ease-in-out infinite 0.1s; }
      .bar-5 { animation: wave5 1.3s ease-in-out infinite 0.25s; }

      @keyframes pulseDot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .green-dot { animation: pulseDot 2s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- Capsule Outer Frame -->
  <rect x="2" y="2" width="916" height="82" rx="41" fill="url(#island-fill)" stroke="url(#island-border)" stroke-width="1.2" />

  <!-- ================= LEFT: AUDIO / SYSTEM WAVEFORM ================= -->
  <g transform="translate(32, 0)">
    <rect class="bar-1" x="0" y="40" width="3.5" height="6" rx="1.75" fill="#38bdf8" />
    <rect class="bar-2" x="8" y="32" width="3.5" height="22" rx="1.75" fill="#e2e8f0" />
    <rect class="bar-3" x="16" y="37" width="3.5" height="12" rx="1.75" fill="#38bdf8" />
    <rect class="bar-4" x="24" y="30" width="3.5" height="26" rx="1.75" fill="#2dd4bf" />
    <rect class="bar-5" x="32" y="39" width="3.5" height="8" rx="1.75" fill="#94a3b8" />

    <text x="50" y="39" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.5">ACTIVE FOCUS</text>
    <text x="50" y="55" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="0.5">CURRENT SPECIALIZATION</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="260" y1="20" x2="260" y2="64" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- ================= CENTER: CURRENT FOCUS ================= -->
  <g transform="translate(290, 21)">
    <rect width="360" height="42" rx="21" fill="#06080d" stroke="url(#island-border)" stroke-width="0.8" />
    <circle class="green-dot" cx="20" cy="21" r="3.5" fill="#2dd4bf" />
    <text x="32" y="25" fill="#94a3b8" font-size="11" font-weight="600">
      <tspan fill="#f1f5f9" font-weight="700">SPECIALIZATION :</tspan> Mobile Apps &amp; Scalable Web
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="680" y1="20" x2="680" y2="64" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- ================= RIGHT: LOCATION & AVAILABILITY ================= -->
  <g transform="translate(710, 34)">
    <text font-size="11" font-weight="600">
      <tspan fill="#64748b">LOCATION</tspan>
      <tspan fill="#38bdf8" dx="6">:</tspan>
      <tspan fill="#e2e8f0" dx="6">Indonesia</tspan>
    </text>
    <text y="19" font-size="11" font-weight="600">
      <tspan fill="#64748b">STATUS</tspan>
      <tspan fill="#2dd4bf" dx="6">:</tspan>
      <tspan fill="#2dd4bf" dx="6">Available for Projects</tspan>
    </text>
  </g>
</svg>
