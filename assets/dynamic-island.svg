<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="100%">
  <defs>
    <!-- Titanium Border -->
    <linearGradient id="island-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glass Capsule Fill -->
    <linearGradient id="island-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0f16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06080d" stop-opacity="0.95" />
    </linearGradient>

    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      }
      /* Pure Titanium Waveform (No Neon) */
      @keyframes wave1 { 0%, 100% { height: 6px; y: 37px; } 50% { height: 24px; y: 28px; } }
      @keyframes wave2 { 0%, 100% { height: 20px; y: 30px; } 50% { height: 8px; y: 36px; } }
      @keyframes wave3 { 0%, 100% { height: 10px; y: 35px; } 50% { height: 28px; y: 26px; } }
      @keyframes wave4 { 0%, 100% { height: 24px; y: 28px; } 50% { height: 10px; y: 35px; } }
      @keyframes wave5 { 0%, 100% { height: 8px; y: 36px; } 50% { height: 16px; y: 32px; } }

      .bar-1 { animation: wave1 1.2s ease-in-out infinite; }
      .bar-2 { animation: wave2 1.4s ease-in-out infinite 0.15s; }
      .bar-3 { animation: wave3 1.1s ease-in-out infinite 0.3s; }
      .bar-4 { animation: wave4 1.5s ease-in-out infinite 0.1s; }
      .bar-5 { animation: wave5 1.3s ease-in-out infinite 0.25s; }
    ]]></style>
  </defs>

  <!-- Capsule Frame -->
  <rect x="2" y="2" width="916" height="76" rx="38" fill="url(#island-fill)" stroke="url(#island-border)" stroke-width="1.2" />

  <!-- ================= LEFT: PURE TITANIUM WAVEFORM ================= -->
  <g transform="translate(36, 0)">
    <rect class="bar-1" x="0" y="37" width="3" height="6" rx="1.5" fill="#94a3b8" />
    <rect class="bar-2" x="7" y="30" width="3" height="20" rx="1.5" fill="#e2e8f0" />
    <rect class="bar-3" x="14" y="35" width="3" height="10" rx="1.5" fill="#cbd5e1" />
    <rect class="bar-4" x="21" y="28" width="3" height="24" rx="1.5" fill="#f8fafc" />
    <rect class="bar-5" x="28" y="36" width="3" height="8" rx="1.5" fill="#64748b" />

    <text x="46" y="36" fill="#f8fafc" font-size="11.5" font-weight="700" letter-spacing="0.5">DEV ACTIVITY</text>
    <text x="46" y="51" fill="#64748b" font-size="10" font-weight="600" letter-spacing="0.5">BUILDING &amp; SHIPPING</text>
  </g>

  <!-- Divider 1 -->
  <line x1="250" y1="18" x2="250" y2="58" stroke="#334155" stroke-width="0.8" opacity="0.4" />

  <!-- ================= CENTER: CLEAN FOCUS (NO NEON DOTS) ================= -->
  <g transform="translate(275, 18)">
    <rect width="365" height="40" rx="20" fill="#05070b" stroke="url(#island-border)" stroke-width="0.8" />
    <text x="182" y="24" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">
      <tspan fill="#ffffff" font-weight="700">FOCUS :</tspan> Cross-Platform Mobile &amp; Modern Web
    </text>
  </g>

  <!-- Divider 2 -->
  <line x1="665" y1="18" x2="665" y2="58" stroke="#334155" stroke-width="0.8" opacity="0.4" />

  <!-- ================= RIGHT: LOCATION & AVAILABILITY ================= -->
  <g transform="translate(695, 31)">
    <text font-size="11" font-weight="600">
      <tspan fill="#64748b">LOCATION</tspan>
      <tspan fill="#94a3b8" dx="6">:</tspan>
      <tspan fill="#f1f5f9" dx="6">Indonesia</tspan>
    </text>
    <text y="18" font-size="11" font-weight="600">
      <tspan fill="#64748b">STATUS</tspan>
      <tspan fill="#94a3b8" dx="6">:</tspan>
      <tspan fill="#e2e8f0" dx="6">Open to Collaborate</tspan>
    </text>
  </g>
</svg>
