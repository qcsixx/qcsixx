<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 445 150" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      }
    ]]></style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="2" y="2" width="441" height="146" rx="14" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.2" />

  <!-- Card Header -->
  <g transform="translate(24, 26)">
    <!-- Active Status Indicator -->
    <circle cx="6" cy="6" r="3.5" fill="#2dd4bf" />
    <text x="18" y="10" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="-0.3">pawsnature</text>
    <!-- External Link Arrow -->
    <text x="375" y="10" fill="#64748b" font-size="14" font-weight="600">↗</text>
  </g>

  <!-- Project Description -->
  <g transform="translate(24, 58)">
    <text fill="#cbd5e1" font-size="12" font-weight="400">
      <tspan x="0" y="0">Interactive web application centered on ergonomic user experience,</tspan>
      <tspan x="0" y="18" fill="#64748b">responsive layout fluidity, and resilient state synchronization.</tspan>
    </text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 104)">
    <rect x="0" y="0" width="86" height="22" rx="11" fill="#111622" stroke="url(#card-border)" stroke-width="0.8" />
    <text x="43" y="14" fill="#38bdf8" font-size="10.5" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="94" y="0" width="94" height="22" rx="11" fill="#111622" stroke="url(#card-border)" stroke-width="0.8" />
    <text x="141" y="14" fill="#06B6D4" font-size="10.5" font-weight="600" text-anchor="middle">TailwindCSS</text>

    <rect x="196" y="0" width="76" height="22" rx="11" fill="#111622" stroke="url(#card-border)" stroke-width="0.8" />
    <text x="234" y="14" fill="#94a3b8" font-size="10.5" font-weight="600" text-anchor="middle">Web App</text>
  </g>
</svg>
