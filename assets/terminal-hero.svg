<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="100%">
  <defs>
    <!-- Dark Slate & Obsidian Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Scanline Texture -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
    </pattern>

    <style><![CDATA[
      * {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.9s infinite;
        fill: #38bdf8;
      }
      @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }
      .status-dot {
        animation: pulse 2.5s infinite ease-in-out;
      }
    ]]></style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="916" height="346" rx="10" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.2" />
  <rect x="2" y="2" width="916" height="346" rx="10" fill="url(#scanlines)" />

  <!-- Window Header Bar (Wayland / Hyprland Style) -->
  <rect x="2" y="2" width="916" height="38" rx="10" fill="#0d131f" />
  <line x1="2" y1="40" x2="918" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="60" cy="21" r="5.5" fill="#10b981" opacity="0.85" />

  <!-- Title Center -->
  <text x="460" y="25" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">qcsixx@archlinux:~ (hyprland)</text>

  <!-- Live Status Chip (Right) -->
  <g transform="translate(746, 11)">
    <rect width="148" height="20" rx="10" fill="#042727" stroke="#0d9488" stroke-width="0.8" />
    <circle class="status-dot" cx="13" cy="10" r="3.5" fill="#2dd4bf" />
    <text x="24" y="14" fill="#2dd4bf" font-size="10" font-weight="700" letter-spacing="0.5">ONLINE // READY</text>
  </g>

  <!-- ================= LEFT COLUMN: QCSIX BLOCK ASCII & SPECS ================= -->
  <!-- Bold Graphic Monospace ASCII "QCSIX" -->
  <g transform="translate(30, 65)">
    <text fill="url(#cyan-glow)" font-size="13" font-weight="700" xml:space="preserve">
      <tspan x="0" y="20">  ___   ____ ____ _____ _  __</tspan>
      <tspan x="0" y="38"> / _ \ / ___/ ___|_   _\ \/ /</tspan>
      <tspan x="0" y="56">| | | | |   \___ \ | |  \  / </tspan>
      <tspan x="0" y="74">| |_| | |___ ___) || |  /  \ </tspan>
      <tspan x="0" y="92"> \__\_\\____|____/ |_| /_/\_\</tspan>
    </text>

    <!-- Subsystem Spec Box -->
    <rect x="0" y="125" width="280" height="95" rx="6" fill="#090e17" stroke="#1e293b" stroke-width="1" />
    <text font-size="11.5" font-weight="600">
      <tspan fill="#64748b" x="14" y="150">HOST</tspan>
      <tspan fill="#38bdf8" x="80" y="150">::</tspan>
      <tspan fill="#f1f5f9" x="98" y="150">archlinux (x86_64)</tspan>

      <tspan fill="#64748b" x="14" y="172">WM</tspan>
      <tspan fill="#38bdf8" x="80" y="172">::</tspan>
      <tspan fill="#f1f5f9" x="98" y="172">hyprland (wayland)</tspan>

      <tspan fill="#64748b" x="14" y="194">EDITOR</tspan>
      <tspan fill="#38bdf8" x="80" y="194">::</tspan>
      <tspan fill="#f1f5f9" x="98" y="194">neovim / linux-cli</tspan>
    </text>
  </g>

  <!-- Vertical Divider (Clean Dashed) -->
  <line x1="345" y1="55" x2="345" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- ================= RIGHT COLUMN: ROBUST ABSOLUTE Y TERMINAL LINES ================= -->
  <g transform="translate(375, 65)">
    <!-- Line 1: Command whoami -->
    <text x="0" y="20" font-size="13" font-weight="700">
      <tspan fill="#38bdf8">❯</tspan>
      <tspan fill="#f1f5f9" dx="8">whoami</tspan>
    </text>

    <!-- Line 2: Identity Output -->
    <text x="14" y="46" font-size="12.5" font-weight="600">
      <tspan fill="#64748b">➔</tspan>
      <tspan fill="#f8fafc" dx="6">Rifqi Primanda (qcsixx)</tspan>
      <tspan fill="#2dd4bf" dx="6">• Full-Stack &amp; Mobile Engineer</tspan>
    </text>

    <!-- Line 3: Command cat system.txt -->
    <text x="0" y="86" font-size="13" font-weight="700">
      <tspan fill="#38bdf8">❯</tspan>
      <tspan fill="#f1f5f9" dx="8">cat profile.json</tspan>
    </text>

    <!-- Line 4 to 8: Clean Key-Value Profile Spec -->
    <text font-size="12" font-weight="600">
      <tspan fill="#38bdf8" x="14" y="112">Focus</tspan>
      <tspan fill="#64748b" x="80" y="112">:</tspan>
      <tspan fill="#f1f5f9" x="96" y="112">Cross-Platform Mobile Apps &amp; Scalable Web Platforms</tspan>

      <tspan fill="#38bdf8" x="14" y="136">Stack</tspan>
      <tspan fill="#64748b" x="80" y="136">:</tspan>
      <tspan fill="#f1f5f9" x="96" y="136">Flutter, TypeScript, Next.js, Go, Python, PHP</tspan>

      <tspan fill="#38bdf8" x="14" y="160">Systems</tspan>
      <tspan fill="#64748b" x="80" y="160">:</tspan>
      <tspan fill="#f1f5f9" x="96" y="160">Clean Architecture, Microservices, REST &amp; gRPC</tspan>

      <tspan fill="#38bdf8" x="14" y="184">Mission</tspan>
      <tspan fill="#64748b" x="80" y="184">:</tspan>
      <tspan fill="#2dd4bf" x="96" y="184">Building high-performance software with zero clutter</tspan>
    </text>

    <!-- Line 9: Interactive Active Prompt -->
    <text x="0" y="222" font-size="13" font-weight="700">
      <tspan fill="#38bdf8">❯</tspan>
      <tspan fill="#f1f5f9" dx="8">git status</tspan>
      <tspan fill="#64748b" dx="8">--branch main</tspan>
      <tspan class="cursor" dx="6">█</tspan>
    </text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="2" y="312" width="916" height="34" fill="#080c14" />
  <line x1="2" y1="312" x2="918" y2="312" stroke="#1e293b" stroke-width="1" />
  
  <text x="24" y="333" fill="#64748b" font-size="11" font-weight="600">
    <tspan fill="#38bdf8">NORMAL</tspan>
    <tspan fill="#334155" dx="10">|</tspan>
    <tspan dx="10">main</tspan>
    <tspan fill="#334155" dx="10">|</tspan>
    <tspan dx="10">utf-8</tspan>
    <tspan fill="#334155" dx="10">|</tspan>
    <tspan dx="10">archlinux / hyprland</tspan>
  </text>

  <text x="896" y="333" fill="#2dd4bf" font-size="11" font-weight="600" text-anchor="end">
    ● 0 ERRORS // CLEAN BUILD
  </text>
</svg>
