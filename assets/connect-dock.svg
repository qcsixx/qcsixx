<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 64" width="100%" height="100%">
  <defs>
    <linearGradient id="dock-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06080e" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="dock-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
    <style><![CDATA[
      * {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      }
      .dock-pill {
        fill: #f1f5f9;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    ]]></style>
  </defs>

  <!-- Floating Glass Dock Frame -->
  <rect x="2" y="2" width="916" height="60" rx="30" fill="url(#dock-bg)" stroke="url(#dock-border)" stroke-width="1.2" />

  <!-- Dock Center Items -->
  <g transform="translate(145, 16)">
    <!-- LinkedIn -->
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#141a26" stroke="url(#dock-border)" stroke-width="0.8" />
    <circle cx="18" cy="16" r="4" fill="#0A66C2" />
    <text x="32" y="20" class="dock-pill">LinkedIn</text>

    <!-- Instagram -->
    <rect x="120" y="0" width="112" height="32" rx="16" fill="#141a26" stroke="url(#dock-border)" stroke-width="0.8" />
    <circle cx="18" cy="16" r="4" fill="#E4405F" />
    <text x="32" y="20" class="dock-pill">Instagram</text>

    <!-- Discord -->
    <rect x="247" y="0" width="102" height="32" rx="16" fill="#141a26" stroke="url(#dock-border)" stroke-width="0.8" />
    <circle cx="18" cy="16" r="4" fill="#5865F2" />
    <text x="32" y="20" class="dock-pill">Discord</text>

    <!-- Email -->
    <rect x="364" y="0" width="95" height="32" rx="16" fill="#141a26" stroke="url(#dock-border)" stroke-width="0.8" />
    <circle cx="18" cy="16" r="4" fill="#D14836" />
    <text x="32" y="20" class="dock-pill">Email</text>

    <!-- Portfolio -->
    <rect x="474" y="0" width="105" height="32" rx="16" fill="#141a26" stroke="url(#dock-border)" stroke-width="0.8" />
    <circle cx="18" cy="16" r="4" fill="#38BDF8" />
    <text x="32" y="20" class="dock-pill">Portfolio</text>
  </g>
</svg>
