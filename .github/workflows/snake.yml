name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution grid snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#161e2e,#0d3846,#0e657a,#1798b3,#38bdf8
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2dd4bf&color_dots=#0f172a,#1e293b,#0284c7,#38bdf8,#2dd4bf

      - name: Commit & Push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake*.svg || true
          if git diff --staged --quiet; then
            echo "No changes in snake assets."
          else
            git commit -m "chore: auto-update contribution snake matrix [skip ci]"
            git push
          fi
